name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        id: dotnet
        with:
          dotnet-version: 8.0.4xx
      # Newer SDKs preinstalled on the runner would otherwise take over and may bring new warnings.
      - name: Pin .NET SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }}
      - name: Build
        run: dotnet build SharpAgent.csproj -c Release --warnaserror
      - name: Test local workflows
        run: dotnet run --project Tests/SharpAgent.Tests.csproj -c Release
